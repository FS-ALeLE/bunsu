<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>∞ 분수 탐험대</title>
<link rel="stylesheet" href="common/ui.css">
<style>
  body { -webkit-user-select: text; user-select: text; }
  .hub { max-width: 64rem; margin: 0 auto; padding: 1.2rem 1rem 3rem; display: flex; flex-direction: column; gap: 1.2rem; }
  .hero { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .hero h1 { margin: 0; font-size: 2rem; }
  .hero p { margin: 0.2rem 0 0; color: var(--sub); }
  .class-box { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; background: var(--panel); border: 2px solid var(--line); border-radius: 1rem; padding: 0.5rem 0.8rem; }
  .class-box .text-input { width: 8rem; flex: none; }
  h2 { margin: 0.4rem 0 0; font-size: 1.2rem; }
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: 0.8rem; }
  .app-card { background: var(--panel); border: 2px solid var(--line); border-radius: 1.2rem; padding: 0.9rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .app-card h3 { margin: 0; font-size: 1.15rem; }
  .app-card .when { font-size: 0.8rem; color: var(--sub); font-weight: 700; }
  .app-card p { margin: 0; font-size: 0.9rem; }
  .app-card .links { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: auto; }
  .app-card .links .btn { min-height: 2.2rem; font-size: 0.85rem; padding: 0 0.7rem; }
  .num { display: inline-flex; width: 1.6rem; height: 1.6rem; align-items: center; justify-content: center; border-radius: 50%; background: var(--primary); color: #fff; font-size: 0.85rem; margin-right: 0.3rem; }
  .num.follow { background: #9a8f80; }
  details { background: var(--panel); border: 2px solid var(--line); border-radius: 1rem; padding: 0.6rem 1rem; }
  summary { cursor: pointer; font-weight: 800; font-size: 1.05rem; }
  details .col { margin-top: 0.6rem; }
  .steps { margin: 0.4rem 0; padding-left: 1.3rem; line-height: 1.7; }
  .steps code, .mono { font-family: Consolas, monospace; font-size: 0.85rem; background: #f3eee6; padding: 0.05rem 0.3rem; border-radius: 0.3rem; word-break: break-all; }
  .setting-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .setting-row .text-input { min-width: 14rem; }
  .msg { font-weight: 800; min-height: 1.3em; margin: 0; }
  .msg.ok { color: #1d6b40; }
  .msg.bad { color: #8a6a00; }
  .note { font-size: 0.85rem; color: var(--sub); margin: 0; }

  /* QR 크게 보기(전자칠판에 띄우기) */
  .qr-overlay { position: fixed; inset: 0; z-index: 60; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 1rem; }
  .qr-overlay h2 { font-size: 2.2rem; margin: 0; text-align: center; }
  .qr-overlay svg { width: min(70vh, 80vw); height: auto; }
  .qr-overlay .mono { font-size: 1rem; max-width: 90vw; text-align: center; }
  .qr-small svg { width: 7rem; height: 7rem; }
</style>
</head>
<body>
<main class="hub" id="hub"></main>
<noscript>이 페이지는 자바스크립트가 켜져 있어야 동작해요.</noscript>
<script type="module" src="index.js"></script>
</body>
</html>
